<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title aria-live="polite">Todo App</title>
    <link rel="stylesheet" href="./src/style.css">
</head>
<body>
    <header class="app-bar" role="banner">
        <div class="left-section">
            <button class="icon-btn" id="menuBtn" aria-label="Open navigation menu">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3,18h18v-2H3v2zm0,-5h18v-2H3v2zm0,-7v2h18V6H3z"/></svg>
            </button>
            <h1 id="appTitle">Todo</h1>
        </div>
        <div class="right-section">
            <!-- Language Selector -->
            <select id="langSelect" aria-label="Change language" class="lang-dropdown">
                <option value="en">EN</option>
                <option value="pt">PT</option>
                <option value="es">ES</option>
            </select>
            <!-- Theme Toggle Button -->
            <button class="icon-btn" id="themeToggleBtn" aria-label="Toggle light theme">
                <span id="themeIcon" aria-hidden="true">🌙</span>
            </button>
            <button class="icon-btn" id="filterBtn" aria-label="Filter tasks">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10,18h4v-2h-4v2zM3,6v2h18V6H3zm3,7h12v-2H6v2z"/></svg>
            </button>
            <button class="icon-btn" id="moreBtn" aria-label="More options">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12,8c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zm0,2c-1.1,0 -2,0.9 -2,2s0.9,2 2,2 2,-0.9 2,-2 -0.9,-2 -2,-2zm0,6c-1.1,0 -2,0.9 -2,2s0.9,2 2,2 2,-0.9 2,-2 -0.9,-2 -2,-2z"/></svg>
            </button>
        </div>
    </header>

    <main class="main-content" role="main">
        <h2 id="filterHeading" class="filter-heading">All Tasks</h2>
        
        <ul class="task-list" id="taskList" aria-label="List of tasks">
            <!-- Mock tasks hardcoded from screenshot baseline -->
            <li class="task-item">
                <label class="checkbox-container">
                    <input type="checkbox" id="task1">
                    <span class="custom-checkbox"></span>
                    <span class="task-text">Build tower in Pisa</span>
                </label>
            </li>
            <li class="task-item">
                <label class="checkbox-container">
                    <input type="checkbox" id="task2">
                    <span class="custom-checkbox"></span>
                    <span class="task-text">Finish bridge in Tacoma</span>
                </label>
            </li>
            <li class="task-item">
                <label class="checkbox-container">
                    <input type="checkbox" id="task3">
                    <span class="custom-checkbox"></span>
                    <span class="task-text">Do the testing codelab</span>
                </label>
            </li>
        </ul>

        <!-- Floating Action Button -->
        <button class="fab" id="addTaskFab" aria-label="Add new task">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19,13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        </button>
    </main>

    <script src="./src/script.js"></script>
</body>
</html>
